# ==============================================================================
# APAARIX Backend Configuration
# APAAR-Based Student Verification & Enrolment Intelligence for AICTE
# ==============================================================================

spring.application.name=apaarix-backend
server.port=${PORT:8080}

# Default DataSource: H2 in PostgreSQL Mode (zero setup required for initial test/demo)
# Set SPRING_PROFILES_ACTIVE=postgres to switch to local or containerized PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:apaarix_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging and inspecting tables)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Application Custom Properties
apaarix.api.version=v1
apaarix.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
apaarix.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
apaarix.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.apaarix=DEBUG
logging.level.org.springframework.web=INFO
