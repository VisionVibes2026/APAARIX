version: '3.8'

services:
  apaarix-postgres:
    image: postgres:16-alpine
    container_name: apaarix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apaarix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - apaarix_pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d apaarix_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  apaarix-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: apaarix_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@apaarix.aicte.gov.in
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - apaarix-postgres

volumes:
  apaarix_pgdata:
    driver: local
